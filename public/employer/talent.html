<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Search — JobMagnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .nav-link { transition: all 0.15s; }
    .nav-link:hover { background: rgba(5,150,105,0.1); color: #059669; }
    .nav-link.active { background: rgba(5,150,105,0.15); color: #059669; font-weight: 600; }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    input:focus, select:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
    textarea:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Sidebar -->
  <div class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-100 z-30 shadow-sm">
    <div class="p-6 border-b border-gray-100">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <span class="font-bold text-gray-900">JobMagnet</span>
      </a>
    </div>
    <div class="p-4">
      <div class="mb-6 p-3 bg-blue-50 rounded-xl">
        <p class="text-sm font-semibold text-gray-900" id="user-name">Loading...</p>
        <p class="text-xs text-blue-600 mt-0.5 font-medium">Employer Account</p>
      </div>
      <nav class="space-y-1">
        <a href="/employer/dashboard.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>Dashboard</a>
        <a href="/employer/talent.html" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Talent Search</a>
        <a href="/employer/messages.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8"/></svg>Messages</a>
      </nav>
    </div>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-100">
      <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Log Out
      </button>
    </div>
  </div>

  <!-- Main -->
  <div class="ml-64 p-8">
    <div class="max-w-6xl mx-auto">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Talent Search</h1>
        <p class="text-gray-500 mt-1">Browse certified candidates filtered by skill and category</p>
      </div>

      <!-- Search Filters -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Search by Skill</label>
            <input type="text" id="skill-search" placeholder="e.g., Construction Safety, HVAC..." oninput="applyFilters()"
              class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm transition-all">
          </div>
          <div class="w-64">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Filter by Category</label>
            <select id="cat-filter" onchange="applyFilters()" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm transition-all bg-white">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="flex items-end">
            <button onclick="clearFilters()" class="px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
              Clear
            </button>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div id="results-header" class="flex items-center justify-between mb-4">
        <p class="text-sm text-gray-500" id="results-count">Loading...</p>
      </div>

      <div id="talent-grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">
        <div class="col-span-3 text-center py-12 text-gray-400">Loading candidates...</div>
      </div>
    </div>
  </div>

  <!-- Message Modal -->
  <div id="msg-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4 p-6">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold text-gray-900">Send Message</h2>
        <button onclick="closeMsg()" class="text-gray-400 hover:text-gray-600 p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="mb-4 p-3 bg-gray-50 rounded-xl">
        <p class="text-sm text-gray-600">To: <span id="msg-recipient" class="font-semibold text-gray-900"></span></p>
      </div>
      <div id="msg-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-4 text-sm"></div>
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Subject</label>
        <input type="text" id="msg-subject" placeholder="Job Opportunity at [Company]"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all">
      </div>
      <div class="mb-5">
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Message</label>
        <textarea id="msg-content" rows="5" placeholder="Hi [Name], I came across your profile on JobMagnet and I'm impressed by your..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all resize-none"></textarea>
      </div>
      <div class="flex gap-3">
        <button onclick="closeMsg()" class="flex-1 border border-gray-200 py-2.5 rounded-xl font-semibold text-sm text-gray-700 hover:bg-gray-50 transition-colors">Cancel</button>
        <button onclick="sendMsg()" id="send-btn" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-emerald-700 transition-colors">Send Message</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('jm_token');
    const user = JSON.parse(localStorage.getItem('jm_user') || '{}');
    if (!token) window.location.href = '/login.html';
    if (user.role !== 'employer') window.location.href = '/seeker/dashboard.html';

    document.getElementById('user-name').textContent = user.company_name || user.email;

    let allTalent = [];
    let msgRecipientId = null;

    const CATEGORY_ICONS = {
      'Construction & Trades': '🏗️', 'Automotive & Mechanics': '🔧', 'HVAC & Plumbing': '❄️',
      'Welding & Fabrication': '⚡', 'Electrical': '🔌', 'Healthcare Support': '🏥',
      'Logistics & Warehousing': '📦', 'Manufacturing': '🏭', 'IT & Tech Support': '💻',
      'Administrative & Office Skills': '📋'
    };

    async function loadTalent() {
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('category');

      const [talentRes, catsRes] = await Promise.all([
        fetch('/api/employer/talent', { headers: { 'Authorization': `Bearer ${token}` } }),
        fetch('/api/employer/categories', { headers: { 'Authorization': `Bearer ${token}` } })
      ]);

      allTalent = await talentRes.json();
      const cats = await catsRes.json();

      const catSelect = document.getElementById('cat-filter');
      cats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        if (catParam && cat === catParam) opt.selected = true;
        catSelect.appendChild(opt);
      });

      renderTalent(catParam ? allTalent.filter(c => c.skills.some(s => s.category === catParam)) : allTalent);
    }

    function applyFilters() {
      const skill = document.getElementById('skill-search').value.toLowerCase();
      const cat = document.getElementById('cat-filter').value;
      let filtered = allTalent;
      if (skill) filtered = filtered.filter(c => c.skills.some(s => s.title.toLowerCase().includes(skill)));
      if (cat) filtered = filtered.filter(c => c.skills.some(s => s.category === cat));
      renderTalent(filtered);
    }

    function clearFilters() {
      document.getElementById('skill-search').value = '';
      document.getElementById('cat-filter').value = '';
      renderTalent(allTalent);
    }

    function renderTalent(candidates) {
      const grid = document.getElementById('talent-grid');
      document.getElementById('results-count').textContent = `${candidates.length} certified candidate${candidates.length !== 1 ? 's' : ''} found`;

      if (!candidates || candidates.length === 0) {
        grid.innerHTML = `
          <div class="col-span-3 text-center py-16">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-10 h-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857"/></svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-500 mb-2">No candidates found</h3>
            <p class="text-gray-400 text-sm">Try adjusting your filters or check back as more candidates earn certificates</p>
          </div>`;
        return;
      }

      grid.innerHTML = candidates.map(c => {
        const initials = c.first_name && c.last_name ? `${c.first_name[0]}${c.last_name[0]}` : (c.email || 'U')[0].toUpperCase();
        return `
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 card-hover">
            <div class="flex items-center gap-3 mb-4">
              ${c.photo_url
                ? `<img src="${c.photo_url}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
                : ''}
              <div class="w-12 h-12 bg-emerald-100 rounded-xl flex-shrink-0 flex items-center justify-center text-emerald-700 font-bold text-sm" ${c.photo_url ? 'style="display:none;"' : ''}>
                ${initials}
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-bold text-gray-900 text-sm">${c.first_name} ${c.last_name}</h3>
                ${c.title ? `<p class="text-xs text-emerald-600 font-medium">${c.title}</p>` : ''}
                ${c.location ? `<p class="text-xs text-gray-400">${c.location}</p>` : ''}
              </div>
            </div>
            ${c.bio ? `<p class="text-xs text-gray-600 mb-3 line-clamp-2 leading-relaxed">${c.bio}</p>` : ''}
            <div class="mb-4">
              <div class="text-xs font-semibold text-gray-500 mb-2">${c.skills.length} Verified Skill${c.skills.length !== 1 ? 's' : ''}</div>
              <div class="flex flex-wrap gap-1.5">
                ${c.skills.slice(0, 4).map(s => `
                  <span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-100 px-2 py-0.5 rounded-full font-medium">
                    ${CATEGORY_ICONS[s.category] || ''} ${s.title.replace(/ 101$| Fundamentals$| Basics$/, '')}
                  </span>`).join('')}
                ${c.skills.length > 4 ? `<span class="text-xs text-gray-400">+${c.skills.length - 4} more</span>` : ''}
              </div>
            </div>
            <button onclick="openMsg('${c.id}', '${c.first_name} ${c.last_name}')"
              class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 transition-colors flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8"/></svg>
              Message Candidate
            </button>
          </div>`;
      }).join('');
    }

    function openMsg(recipientId, name) {
      msgRecipientId = recipientId;
      document.getElementById('msg-recipient').textContent = name;
      document.getElementById('msg-subject').value = '';
      document.getElementById('msg-content').value = '';
      document.getElementById('msg-error').classList.add('hidden');
      const modal = document.getElementById('msg-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeMsg() {
      document.getElementById('msg-modal').classList.add('hidden');
      document.getElementById('msg-modal').classList.remove('flex');
    }

    async function sendMsg() {
      const btn = document.getElementById('send-btn');
      const errEl = document.getElementById('msg-error');
      errEl.classList.add('hidden');
      const content = document.getElementById('msg-content').value.trim();
      if (!content) { errEl.textContent = 'Please write a message.'; errEl.classList.remove('hidden'); return; }

      btn.textContent = 'Sending...';
      btn.disabled = true;

      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recipient_id: msgRecipientId,
          subject: document.getElementById('msg-subject').value,
          content
        })
      });

      if (res.ok) {
        closeMsg();
        btn.textContent = 'Send Message';
        btn.disabled = false;
        alert('Message sent successfully!');
      } else {
        const data = await res.json();
        errEl.textContent = data.error || 'Failed to send.';
        errEl.classList.remove('hidden');
        btn.textContent = 'Send Message';
        btn.disabled = false;
      }
    }

    function logout() {
      localStorage.removeItem('jm_token');
      localStorage.removeItem('jm_user');
      window.location.href = '/';
    }

    loadTalent();
  </script>
</body>
</html>
