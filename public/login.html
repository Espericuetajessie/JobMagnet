<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — JobMagnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-emerald-50 min-h-screen flex items-center justify-center py-12 px-4">

  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <span class="text-xl font-bold text-gray-900">JobMagnet</span>
      </a>
      <h1 class="text-3xl font-bold text-gray-900">Welcome back</h1>
      <p class="text-gray-600 mt-2">Log in to continue building skills</p>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
      <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-5 text-sm"></div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input type="password" id="password" placeholder="Your password" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-emerald-700 transition-colors">
          Log In
        </button>
      </form>

      <p class="text-center text-gray-500 text-sm mt-5">
        Don't have an account? <a href="/choose-path.html" class="text-emerald-600 font-semibold hover:underline">Sign up</a>
      </p>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('jm_token');
    if (token) {
      const user = JSON.parse(localStorage.getItem('jm_user') || '{}');
      window.location.href = user.role === 'employer' ? '/employer/dashboard.html' : '/seeker/dashboard.html';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error-msg');
      errorEl.classList.add('hidden');

      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.remove('hidden');
          btn.textContent = 'Log In';
          btn.disabled = false;
          return;
        }

        localStorage.setItem('jm_token', data.token);
        localStorage.setItem('jm_user', JSON.stringify(data.user));
        window.location.href = data.user.role === 'employer' ? '/employer/dashboard.html' : '/seeker/dashboard.html';
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.remove('hidden');
        btn.textContent = 'Log In';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
