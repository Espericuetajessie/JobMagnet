<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — JobMagnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .nav-link { transition: all 0.15s; }
    .nav-link:hover { background: rgba(5,150,105,0.1); color: #059669; }
    .nav-link.active { background: rgba(5,150,105,0.15); color: #059669; font-weight: 600; }
    input:focus, textarea:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Sidebar (same as dashboard) -->
  <div class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-100 z-30 shadow-sm">
    <div class="p-6 border-b border-gray-100">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <span class="font-bold text-gray-900">JobMagnet</span>
      </a>
    </div>
    <div class="p-4">
      <div class="mb-6 p-3 bg-emerald-50 rounded-xl">
        <p class="text-sm font-semibold text-gray-900" id="user-name">Loading...</p>
        <p class="text-xs text-emerald-600 mt-0.5 font-medium" id="sub-status"></p>
      </div>
      <nav class="space-y-1">
        <a href="/seeker/dashboard.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>Dashboard</a>
        <a href="/seeker/profile.html" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>My Profile</a>
        <a href="/seeker/resume.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Resume Builder</a>
        <a href="/seeker/courses.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13"/></svg>Courses</a>
        <a href="/seeker/certificates.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138"/></svg>Certificates</a>
      </nav>
    </div>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-100">
      <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Log Out
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="ml-64 p-8">
    <div class="max-w-3xl mx-auto">
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900">My Profile</h1>
        <p class="text-gray-500 mt-1">This information is visible to employers searching for talent</p>
      </div>

      <div id="success-msg" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl p-3 mb-5 text-sm font-medium"></div>

      <!-- Profile Card -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 mb-6">
        <h2 class="font-bold text-gray-900 mb-6">Profile Photo & Basic Info</h2>

        <!-- Photo -->
        <div class="flex items-center gap-6 mb-6">
          <div class="relative">
            <div id="photo-preview" class="w-24 h-24 rounded-2xl bg-emerald-100 flex items-center justify-center overflow-hidden border-2 border-gray-200">
              <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Profile Photo URL</label>
            <input type="url" id="photo_url" placeholder="https://example.com/your-photo.jpg"
              class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all"
              oninput="previewPhoto(this.value)">
            <p class="text-xs text-gray-400 mt-1">Paste a direct image URL (JPEG or PNG)</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Professional Title</label>
            <input type="text" id="title" placeholder="e.g., Certified Welder, IT Support Specialist"
              class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Location</label>
            <input type="text" id="location" placeholder="e.g., Houston, TX"
              class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">About Me</label>
          <textarea id="bio" rows="5" placeholder="Tell employers about yourself — your experience, what you're looking for, and what makes you stand out..."
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition-all resize-none"></textarea>
          <p class="text-xs text-gray-400 mt-1">This is your elevator pitch to employers</p>
        </div>
      </div>

      <button onclick="saveProfile()"
        class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-emerald-700 transition-colors">
        Save Profile
      </button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('jm_token');
    const user = JSON.parse(localStorage.getItem('jm_user') || '{}');
    if (!token) window.location.href = '/login.html';

    document.getElementById('user-name').textContent = user.first_name ? `${user.first_name} ${user.last_name}` : user.email;
    document.getElementById('sub-status').textContent = user.is_admin ? 'Admin — Full Access' : (user.subscription_status === 'active' ? 'Active Subscriber' : 'Free Plan');

    async function loadProfile() {
      const res = await fetch('/api/profile', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      document.getElementById('bio').value = data.bio || '';
      document.getElementById('title').value = data.title || '';
      document.getElementById('location').value = data.location || '';
      if (data.photo_url) {
        document.getElementById('photo_url').value = data.photo_url;
        previewPhoto(data.photo_url);
      }
    }

    function previewPhoto(url) {
      const el = document.getElementById('photo-preview');
      if (url) {
        el.innerHTML = `<img src="${url}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<svg class=\\'w-10 h-10 text-emerald-400\\' fill=\\'none\\' stroke=\\'currentColor\\' viewBox=\\'0 0 24 24\\'><path stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' stroke-width=\\'1.5\\' d=\\'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z\\'/></svg>'">`;
      }
    }

    async function saveProfile() {
      const res = await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bio: document.getElementById('bio').value,
          title: document.getElementById('title').value,
          location: document.getElementById('location').value,
          photo_url: document.getElementById('photo_url').value
        })
      });
      const successEl = document.getElementById('success-msg');
      successEl.textContent = 'Profile saved successfully!';
      successEl.classList.remove('hidden');
      setTimeout(() => successEl.classList.add('hidden'), 3000);
    }

    function logout() {
      localStorage.removeItem('jm_token');
      localStorage.removeItem('jm_user');
      window.location.href = '/';
    }

    loadProfile();
  </script>
</body>
</html>
