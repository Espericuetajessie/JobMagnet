<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — JobMagnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-emerald-50 min-h-screen flex items-center justify-center py-12 px-4">

  <div class="max-w-lg w-full">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <span class="text-xl font-bold text-gray-900">JobMagnet</span>
      </a>

      <div id="plan-badge" class="inline-flex items-center gap-2 bg-emerald-100 text-emerald-700 px-4 py-2 rounded-full text-sm font-semibold mb-4">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        <span id="plan-text">Job Seeker — $19/month</span>
      </div>

      <h1 class="text-3xl font-bold text-gray-900">Create your account</h1>
      <p class="text-gray-600 mt-2">Start building skills that get you hired</p>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
      <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-5 text-sm"></div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <!-- Seeker fields -->
        <div id="seeker-fields">
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">First Name</label>
              <input type="text" id="first_name" placeholder="Jane"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Last Name</label>
              <input type="text" id="last_name" placeholder="Smith"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
            </div>
          </div>
        </div>

        <!-- Employer fields -->
        <div id="employer-fields" class="hidden mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Company Name</label>
          <input type="text" id="company_name" placeholder="Acme Construction Co."
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input type="password" id="password" placeholder="Minimum 8 characters" required minlength="8"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
        </div>

        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Confirm Password</label>
          <input type="password" id="confirm_password" placeholder="Repeat your password" required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 transition-all">
        </div>

        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6 text-sm text-emerald-800">
          <div class="flex items-start gap-2">
            <svg class="w-4 h-4 text-emerald-600 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
            <span>Your subscription will be activated after account creation. Payment processing is handled securely.</span>
          </div>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-emerald-700 transition-colors">
          Create Account & Subscribe
        </button>
      </form>

      <p class="text-center text-gray-500 text-sm mt-5">
        Already have an account? <a href="/login.html" class="text-emerald-600 font-semibold hover:underline">Log in</a>
      </p>
      <p class="text-center text-gray-400 text-xs mt-2">
        <a href="/choose-path.html" class="hover:underline">← Change plan</a>
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'seeker';

    if (role === 'employer') {
      document.getElementById('seeker-fields').classList.add('hidden');
      document.getElementById('employer-fields').classList.remove('hidden');
      document.getElementById('plan-text').textContent = 'Employer — $79/month';
      document.getElementById('plan-badge').className = 'inline-flex items-center gap-2 bg-blue-100 text-blue-700 px-4 py-2 rounded-full text-sm font-semibold mb-4';
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error-msg');
      errorEl.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.textContent = 'Creating account...';
      btn.disabled = true;

      const body = { email: document.getElementById('email').value, password, role };
      if (role === 'seeker') {
        body.first_name = document.getElementById('first_name').value;
        body.last_name = document.getElementById('last_name').value;
      } else {
        body.company_name = document.getElementById('company_name').value;
      }

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Signup failed';
          errorEl.classList.remove('hidden');
          btn.textContent = 'Create Account & Subscribe';
          btn.disabled = false;
          return;
        }

        localStorage.setItem('jm_token', data.token);
        localStorage.setItem('jm_user', JSON.stringify(data.user));

        // Redirect to Stripe checkout for subscription
        const checkoutRes = await fetch('/api/stripe/create-subscription-checkout', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${data.token}` }
        });
        const checkoutData = await checkoutRes.json();

        if (checkoutData.url) {
          // Redirect to Stripe Checkout
          window.location.href = checkoutData.url;
        } else {
          // Fallback: show error, user account created but needs to subscribe
          errorEl.textContent = checkoutData.error || 'Could not initiate payment. Please subscribe from dashboard.';
          errorEl.classList.remove('hidden');
          btn.textContent = 'Create Account & Subscribe';
          btn.disabled = false;
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.remove('hidden');
        btn.textContent = 'Create Account & Subscribe';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
